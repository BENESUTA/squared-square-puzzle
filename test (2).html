<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Perfect Squared Square - Standard Logic</title>
    <style>
        :root { --bg: #111; --text: #eee; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
        #puzzle-board {
            position: relative; width: 448px; height: 448px;
            border: 4px solid #666; background: #000; margin-top: 20px;
        }
        .sq {
            position: absolute; cursor: grab; display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: white; border: 1px solid rgba(0,0,0,0.5);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3); z-index: 10;
        }
        .sq.locked { cursor: default; border: 1px solid rgba(255,255,255,0.3); box-shadow: none; z-index: 1 !important; opacity: 0.9; }
        .tray { width: 100vw; height: 200px; margin-top: 20px; background: #1a1a1a; display: flex; flex-wrap: wrap; gap: 5px; padding: 15px; justify-content: center; overflow-y: auto; }
        #clear-msg { display: none; color: #2ecc71; font-size: 24px; font-weight: bold; margin: 10px; }
    </style>
</head>
<body>

    <div id="clear-msg">✨ PERFECT: Order 21 完成！ ✨</div>
    <div id="puzzle-board"></div>
    <div class="tray" id="tray"></div>
    <button onclick="location.reload()" style="margin: 10px; padding: 10px 30px;">リセット</button>

<script>
const SCALE = 4;
// Duijvestijn's Order 21 (Side 112)
// [size, x, y]
const PIECES_DATA = [
    [50, 0, 0], [35, 50, 0], [27, 85, 0],
    [8, 85, 27], [19, 93, 27], [15, 50, 35],
    [17, 65, 35], [11, 82, 35], [6, 82, 46],
    [24, 88, 46], [29, 0, 50], [25, 29, 50],
    [9, 54, 50], [2, 63, 50], [7, 63, 52],
    [18, 70, 52], [16, 54, 59], [4, 29, 75],
    [33, 0, 79], [37, 33, 75], [42, 70, 70],
];

const colors = ["#e74c3c", "#3498db", "#9b59b6", "#f1c40f", "#1abc9c", "#e67e22", "#d35400", "#c0392b", "#27ae60", "#2980b9"];
let active = null;
let dragOffset = { x: 0, y: 0 };

function init() {
    const board = document.getElementById('puzzle-board');
    const tray = document.getElementById('tray');

    PIECES_DATA.sort((a,b) => a[0] - b[0]).forEach((p, i) => {
        const [s, tx, ty] = p;
        const el = document.createElement('div');
        el.className = 'sq';
        el.innerText = s;
        el.style.width = (s * SCALE) + 'px';
        el.style.height = (s * SCALE) + 'px';
        el.style.backgroundColor = colors[i % colors.length];
        
        // 正解の論理座標
        el.dataset.tx = tx;
        el.dataset.ty = ty;
        el.dataset.isLocked = "false";

        el.addEventListener('mousedown', onStart);
        el.addEventListener('touchstart', onStart, {passive: false});
        tray.appendChild(el);
    });
}

function onStart(e) {
    if (this.dataset.isLocked === "true") return;
    e.preventDefault();
    active = this;
    const ev = e.touches ? e.touches[0] : e;

    // トレイからボードへ移動
    if (active.parentElement.id === 'tray') {
        const r = active.getBoundingClientRect();
        const br = document.getElementById('puzzle-board').getBoundingClientRect();
        document.getElementById('puzzle-board').appendChild(active);
        active.style.left = (r.left - br.left) + 'px';
        active.style.top = (r.top - br.top) + 'px';
    }

    const rect = active.getBoundingClientRect();
    dragOffset.x = ev.clientX - rect.left;
    dragOffset.y = ev.clientY - rect.top;
    active.style.zIndex = 1000;
}

function onMove(e) {
    if (!active) return;
    const ev = e.touches ? e.touches[0] : e;
    const br = document.getElementById('puzzle-board').getBoundingClientRect();
    
    let x = ev.clientX - br.left - dragOffset.x;
    let y = ev.clientY - br.top - dragOffset.y;

    active.style.left = x + 'px';
    active.style.top = y + 'px';
}

function onEnd() {
    if (!active) return;

    // 現在の「左上角」が論理グリッド（112単位）のどこに近いか
    const curX = Math.round(parseFloat(active.style.left) / SCALE);
    const curY = Math.round(parseFloat(active.style.top) / SCALE);
    
    const tx = parseInt(active.dataset.tx);
    const ty = parseInt(active.dataset.ty);

    // 許容誤差を少し広め(4単位 = 16px)に設定
    if (Math.abs(curX - tx) <= 4 && Math.abs(curY - ty) <= 4) {
        // ピタッとスナップ
        active.style.left = (tx * SCALE) + 'px';
        active.style.top = (ty * SCALE) + 'px';
        active.dataset.isLocked = "true";
        active.classList.add('locked');
        checkWin();
    }

    active.style.zIndex = "";
    active = null;
}

function checkWin() {
    if (document.querySelectorAll('.sq.locked').length === 21) {
        document.getElementById('clear-msg').style.display = 'block';
    }
}

document.addEventListener('mousemove', onMove);
document.addEventListener('touchmove', onMove, {passive: false});
document.addEventListener('mouseup', onEnd);
document.addEventListener('touchend', onEnd);

init();
</script>
</body>
</html>
